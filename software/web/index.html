<!DOCTYPE html>
<html>

<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Base URL for Flutter Web -->
  <base href="$FLUTTER_BASE_HREF">

  <!-- Character encoding -->
  <meta charset="UTF-8">

  <!-- Responsive viewport for mobile devices -->
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <!-- Browser compatibility -->
  <meta
    http-equiv="X-UA-Compatible"
    content="IE=Edge"
  >

  <!-- Application information -->
  <meta
    name="description"
    content="GaitSense - IoT-Based Gait Monitoring and Sensory Cueing System"
  >

  <meta name="theme-color" content="#1B2535">

  <!-- Mobile app configuration -->
  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <!-- Apple device configuration -->
  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="GaitSense"
  >

  <link
    rel="apple-touch-icon"
    href="icons/Icon-192.png"
  >

  <!-- Favicon -->
  <link
    rel="icon"
    type="image/png"
    href="favicon.png"
  >

  <!-- Web app manifest -->
  <link rel="manifest" href="manifest.json">

  <title>GaitSense</title>

  <!-- Full viewport styling -->
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      min-height: 100%;
      background-color: #1B2535;
    }

    html {
      overflow: hidden;
    }

    body {
      position: relative;
      overflow: hidden;
    }

    flutter-view {
      display: block;
      width: 100%;
      height: 100%;
    }

    * {
      box-sizing: border-box;
    }
  </style>
</head>

<body>
  <!-- Flutter application bootstrap -->
  <script
    src="flutter_bootstrap.js"
    async>
  </script>
</body>
</html>

<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
